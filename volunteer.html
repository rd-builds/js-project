<!DOCTYPE html>
<html>
<head>
  <title>Volunteer</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body class="form-bg volunteer-bg">

<div class="form-container">

  <h2 class="text-center mb-4">
    Volunteer With Us
  </h2>

  <form id="volunteerForm">

    <!-- NAME -->
    <input
      type="text"
      id="volunteerName"
      class="form-control mb-1"
      placeholder="Full Name"
    >

    <small
      class="error-text"
      id="volunteerNameError">
    </small>

    <!-- EMAIL -->
    <input
      type="email"
      id="volunteerEmail"
      class="form-control mb-1 mt-3"
      placeholder="Email Address"
    >

    <small
      class="error-text"
      id="volunteerEmailError">
    </small>

    <!-- PHONE -->
    <input
      type="tel"
      id="volunteerPhone"
      class="form-control mb-1 mt-3"
      placeholder="Phone Number"
    >

    <small
      class="error-text"
      id="volunteerPhoneError">
    </small>

    <!-- ROLE -->
    <select
      id="volunteerRole"
      class="form-control mt-3">

      <option value="">
        Select Role
      </option>

      <option>
        Field Volunteer
      </option>

      <option>
        Event Support
      </option>

      <option>
        Online Support
      </option>

    </select>

    <!-- MESSAGE -->
    <textarea
      class="form-control mt-3"
      rows="4"
      placeholder="Why do you want to volunteer?"
    ></textarea>

    <!-- BUTTON -->
    <button class="btn btn-success w-100 mt-4">
      Submit
    </button>

  </form>

</div>

<script src="script.js"></script>
<!-- CHATBOT WIDGET -->
<div id="chat-widget">
  <div id="chat-window">
    <div class="chat-header">
      <div class="avatar">🤖</div>
      <div class="header-info">
        <h3>AI Assistant</h3>
        <span>Powered by Claude</span>
      </div>
      <button class="close-btn" id="close-btn">✕</button>
    </div>
    <div id="messages">
      <div class="hint">Start a conversation below ↓</div>
    </div>
    <div class="chat-footer">
      <textarea id="user-input" placeholder="Ask me anything…" rows="1"></textarea>
      <button id="send-btn">➤</button>
    </div>
  </div>
  <button id="chat-toggle">💬</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script src="chatbot.js"></script>
</body>
</html>
